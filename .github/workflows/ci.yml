name: Backend CI - NestJS & TypeScript

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Escaneo de secretos (Gitleaks)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar que no haya credenciales (Gitleaks)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/path" zricethezav/gitleaks:latest detect --source="/path" --verbose --redact

  # 2. Compilación, Linter y Pruebas técnicas (NestJS + TypeScript)
  test:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Linter (Oxlint)
        run: npm run lint --if-present

      - name: Validar compilación de TypeScript
        run: npm run build --if-present

      - name: Pruebas unitarias (Jest)
        run: npm run test --if-present

      - name: Pruebas end-to-end (Jest e2e)
        run: npm run test:e2e --if-present
