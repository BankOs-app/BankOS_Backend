name: Backend CI - NestJS & TypeScript

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Escaneo de secretos (Gitleaks Open Source - Sin restricción de licencia)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Escaneo de secretos con Gitleaks
        run: gitleaks detect --verbose --redact

  # 2. Compilación, Linter y Pruebas técnicas (NestJS + TypeScript)
  test:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compilación, Linter y Pruebas
        run: |
          if [ -f "package.json" ]; then
            npm install
            npm run lint --if-present
            npm run build --if-present
            npm test --if-present
          else
            echo "Aviso: package.json aún no existe. Se activará automáticamente cuando inicialices NestJS."
          fi
